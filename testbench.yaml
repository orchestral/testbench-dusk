laravel: "@testbench-dusk"

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

workbench:
  health: true
  welcome: false
  auth: true
  build:
    - drop-sqlite-db
    - create-sqlite-db
    - migrate:refresh
    - asset-publish
  discovers:
    config: true
    web: true
    api: true
    commands: true
    views: true
  sync:
    - from: storage
      to: workbench/storage
      reverse: true

purge:
  files:
    - .env
  directories:
    - public/build
    - public/vendor/*
